<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af' }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .fade-in { animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
    .slide-up { animation: slideUp .3s ease; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px);} to { opacity: 1; transform: none;} }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 6px; }
    .allocation-row { transition: all .2s ease; }
    .allocation-row:hover { background-color: #f8fafc; }
    .allocation-row.selected { background-color: #eff6ff; border-left: 3px solid #3b82f6; }

    /* Shared field styles (kept as plain CSS so they never depend on Tailwind @apply) */
    .input-field, .select-field {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      line-height: 1.5rem;
      color: #0f172a;
      transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
    }
    .input-field:focus, .select-field:focus {
      outline: none;
      background: #fff;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, .18);
    }
    .btn-primary, .btn-danger, .btn-success {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-radius: 0.75rem;
      font-weight: 700;
      color: #fff;
      transition: background-color .15s ease, transform .1s ease;
    }
    .btn-primary { background: #2563eb; padding: 0.875rem 1rem; font-size: 1rem; }
    .btn-primary:hover:not(:disabled) { background: #1d4ed8; }
    .btn-danger { background: #e11d48; padding: 0.875rem 1rem; font-size: 1rem; }
    .btn-danger:hover:not(:disabled) { background: #be123c; }
    .btn-success { background: #059669; padding: 1rem; font-size: 1.125rem; box-shadow: 0 10px 15px -3px rgba(5,150,105,.28); }
    .btn-success:hover:not(:disabled) { background: #047857; }
    .btn-primary:active:not(:disabled), .btn-danger:active:not(:disabled), .btn-success:active:not(:disabled) { transform: scale(.97); }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 1px 2px rgba(15,23,42,.05); }
    .badge { display: inline-flex; align-items: center; gap: 0.375rem; font-weight: 600; font-size: 0.8rem; padding: 0.2rem 0.75rem; border-radius: 9999px; border: 1px solid transparent; white-space: nowrap; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- ===================== MAIN CONTAINER ===================== -->
  <main class="max-w-md mx-auto px-4 py-5 pb-20 space-y-5">

    <!-- ---- HEADER CARD ---- -->
    <div class="card p-5">
      <h1 class="text-lg font-extrabold text-slate-800 mb-5 flex items-center gap-2">
        <i class="fa-solid fa-truck-loading text-blue-600"></i> Penerimaan Barang
      </h1>

      <!-- Pallet / Table Code -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Pallet / Table Code</label>
        <input type="text" id="palletCode" placeholder="Masukkan kode pallet / meja..."
          class="input-field" autocomplete="off">
      </div>

      <!-- SKU Name -->
      <div class="mb-4">
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Nama Barang (SKU)</label>
        <select id="skuSelect" class="select-field">
          <option value="">Pilih SKU...</option>
        </select>
      </div>

      <!-- Current Stock -->
      <div class="bg-blue-50 rounded-xl p-4 border border-blue-200 mb-5">
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Stok Sistem Saat Ini</label>
        <div class="flex items-baseline justify-between">
          <div id="currentStock" class="text-3xl font-extrabold text-blue-700">0</div>
          <span class="text-xs text-blue-500 font-medium">Total di semua rak</span>
        </div>
        <p class="text-[10px] text-blue-500 mt-1">Kuantitas sistem per SKU dari sheet Inventory</p>
      </div>

      <!-- Action Buttons: + Addition / - Reduction -->
      <div class="grid grid-cols-2 gap-3">
        <button id="btnAddition" class="btn-primary" disabled>
          <i class="fa-solid fa-plus text-lg"></i> <span>Addition</span>
        </button>
        <button id="btnReduction" class="btn-danger" disabled>
          <i class="fa-solid fa-minus text-lg"></i> <span>Reduction</span>
        </button>
      </div>
    </div>

    <!-- ---- ALLOCATION LIST ---- -->
    <div class="card overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-200 bg-slate-50">
        <div class="flex items-center justify-between">
          <h2 class="text-sm font-bold text-slate-800">Rak Tujuan & Alokasi</h2>
          <span id="allocCount" class="badge bg-slate-100 text-slate-600 border-slate-200">0 Rak</span>
        </div>
      </div>
      <div id="allocationList" class="divide-y divide-slate-100 max-h-72 overflow-y-auto">
        <div id="emptyState" class="px-4 py-10 text-center text-slate-400">
          <i class="fa-solid fa-layer-group text-3xl mb-2 block opacity-50"></i>
          <p class="text-sm">Belum ada alokasi rak</p>
          <p class="text-[11px] mt-1">Tekan <span class="font-semibold text-blue-600">Addition</span> untuk menambah</p>
        </div>
      </div>
    </div>

    <!-- ---- SUBMIT SECTION ---- -->
    <div class="card p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-slate-800">Ringkasan Inbound</h2>
        <span id="totalQtyBadge" class="badge bg-blue-100 text-blue-700 border-blue-200">Total: 0</span>
      </div>

      <!-- Nomor SJ -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Nomor SJ</label>
        <input type="text" id="nomorSJ" placeholder="Nomor Surat Jalan..."
          class="input-field" autocomplete="off">
      </div>

      <!-- Tanggal Inbound (hidden, auto today) -->
      <input type="hidden" id="tanggalInbound">

      <!-- Remarks -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Remarks</label>
        <textarea id="remarks" rows="2" placeholder="Catatan tambahan (opsional)..."
          class="input-field resize-none"></textarea>
      </div>

      <!-- Submit Button -->
      <button id="btnSubmit" class="btn-success" disabled>
        <i class="fa-solid fa-save"></i> Simpan Inbound
      </button>
    </div>

    <!-- Navigation to Dashboard -->
    <div class="text-center">
      <a href="?page=Index" class="text-sm text-slate-500 hover:text-blue-600 transition flex items-center justify-center gap-1.5">
        <i class="fa-solid fa-chart-line"></i> Buka Dashboard Inventory
      </a>
    </div>

  </main>

  <!-- ===================== MODAL: ADD ALLOCATION ===================== -->
  <div id="allocModal" class="hidden fixed inset-0 z-50">
    <div class="fixed inset-0 bg-slate-900 bg-opacity-60 backdrop-blur-sm" id="modalBackdrop"></div>
    <div class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-200 p-5 z-10 slide-up" id="modalPanel">

      <div class="flex items-center justify-between mb-5">
        <h3 class="text-lg font-extrabold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-plus text-blue-600"></i> Tambah Alokasi Rak
        </h3>
        <button id="btnCloseModal" class="w-9 h-9 rounded-xl hover:bg-slate-100 flex items-center justify-center text-slate-500 transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="space-y-4">
        <!-- Rack Selection -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Pallet / Rak Code</label>
          <select id="modalRackSelect" class="select-field">
            <option value="">Pilih Rak...</option>
          </select>
        </div>

        <!-- SKU Name (read-only, pre-filled) -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Nama Barang</label>
          <div id="modalSkuName" class="bg-slate-100 rounded-xl px-4 py-3 text-base text-slate-700 border border-slate-200 font-medium min-h-[48px] flex items-center">
            -
          </div>
        </div>

        <!-- Qty In -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Qty In</label>
          <input type="number" id="modalQtyIn" placeholder="0" min="1" step="1"
            class="input-field text-center text-xl font-bold" inputmode="numeric">
        </div>

        <!-- Total Inbound (Auto) -->
        <div class="bg-amber-50 rounded-xl p-4 border border-amber-200">
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Total Inbound (Auto)</label>
          <div id="modalTotalInbound" class="text-2xl font-extrabold text-amber-700">0</div>
          <p class="text-[10px] text-amber-600 mt-1">Jumlah otomatis dari semua alokasi + qty ini</p>
        </div>

        <!-- Tanggal Kadaluarsa -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Tanggal Kadaluarsa</label>
          <input type="date" id="modalTglExp" class="input-field">
        </div>

        <!-- Add Button -->
        <button id="btnAddAllocation" class="btn-primary mt-2">
          <i class="fa-solid fa-plus text-lg"></i> Tambahkan ke Rak
        </button>
      </div>
    </div>
  </div>

  <!-- ===================== TOAST ===================== -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] transform translate-y-24 opacity-0 transition-all duration-300 text-sm px-5 py-3.5 rounded-xl shadow-xl flex items-center gap-2.5 max-w-sm border"></div>

  <script>
    // ============================================================
    //  STATE
    // ============================================================
    const STATE = {
      skus: [],
      rackDetails: [],
      allocations: [],
      selectedAllocIndex: -1,
      totalQty: 0
    };

    // ============================================================
    //  DOM ELEMENTS
    // ============================================================
    const els = {
      palletCode:     document.getElementById('palletCode'),
      skuSelect:      document.getElementById('skuSelect'),
      currentStock:   document.getElementById('currentStock'),
      btnAddition:    document.getElementById('btnAddition'),
      btnReduction:   document.getElementById('btnReduction'),
      allocationList: document.getElementById('allocationList'),
      emptyState:     document.getElementById('emptyState'),
      allocCount:     document.getElementById('allocCount'),
      totalQtyBadge:  document.getElementById('totalQtyBadge'),
      nomorSJ:        document.getElementById('nomorSJ'),
      tanggalInbound: document.getElementById('tanggalInbound'),
      remarks:        document.getElementById('remarks'),
      btnSubmit:      document.getElementById('btnSubmit'),

      allocModal:         document.getElementById('allocModal'),
      modalBackdrop:      document.getElementById('modalBackdrop'),
      modalRackSelect:    document.getElementById('modalRackSelect'),
      modalSkuName:       document.getElementById('modalSkuName'),
      modalQtyIn:         document.getElementById('modalQtyIn'),
      modalTotalInbound:  document.getElementById('modalTotalInbound'),
      modalTglExp:        document.getElementById('modalTglExp'),
      btnCloseModal:      document.getElementById('btnCloseModal'),
      btnAddAllocation:   document.getElementById('btnAddAllocation'),
    };

    // ============================================================
    //  INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', function () {
      const today = new Date().toISOString().split('T')[0];
      els.tanggalInbound.value = today;
      els.modalTglExp.value = today;

      bindEvents();
      loadSKUs();
    });

    function bindEvents() {
      els.skuSelect.addEventListener('change', onSKUChange);
      els.btnAddition.addEventListener('click', openModal);
      els.btnReduction.addEventListener('click', removeSelectedAllocation);

      els.btnCloseModal.addEventListener('click', closeModal);
      els.modalBackdrop.addEventListener('click', closeModal);
      els.btnAddAllocation.addEventListener('click', addAllocation);
      els.modalQtyIn.addEventListener('input', updateModalTotal);

      els.btnSubmit.addEventListener('click', submitInbound);
      els.nomorSJ.addEventListener('input', updateSubmitState);

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !els.allocModal.classList.contains('hidden')) closeModal();
      });
    }

    // ============================================================
    //  DATA LOADING
    // ============================================================
    function loadSKUs() {
      callServer('getSKUNames')
        .then(function (skus) {
          STATE.skus = skus || [];
          populateSKUSelect();
        })
        .catch(function (err) {
          showToast('Gagal memuat daftar SKU: ' + err.message, 'error');
        });
    }

    function populateSKUSelect() {
      els.skuSelect.innerHTML = '<option value="">Pilih SKU...</option>' +
        STATE.skus.map(function (sku) {
          return '<option value="' + esc(sku) + '">' + esc(sku) + '</option>';
        }).join('');
    }

    function onSKUChange() {
      const sku = els.skuSelect.value;
      if (!sku) {
        resetSKUState();
        return;
      }

      els.btnAddition.disabled = false;

      callServer('getRackDetailsBySKU', [sku])
        .then(function (racks) {
          STATE.rackDetails = racks || [];
          renderRackSelect();
          updateCurrentStock();
        })
        .catch(function (err) {
          showToast('Gagal memuat detail rak: ' + err.message, 'error');
        });
    }

    function resetSKUState() {
      STATE.rackDetails = [];
      STATE.allocations = [];
      STATE.selectedAllocIndex = -1;
      STATE.totalQty = 0;
      els.currentStock.textContent = '0';
      els.btnAddition.disabled = true;
      renderAllocationList();
      updateSubmitState();
    }

    function updateCurrentStock() {
      const total = STATE.rackDetails.reduce(function (sum, r) { return sum + (r.qtySistem || 0); }, 0);
      els.currentStock.textContent = fmtNum(total);
    }

    function renderRackSelect() {
      els.modalRackSelect.innerHTML = '<option value="">Pilih Rak...</option>' +
        STATE.rackDetails.map(function (r) {
          const stockLabel = r.qtySistem > 0 ? ' (' + fmtNum(r.qtySistem) + ')' : ' (kosong)';
          return '<option value="' + esc(r.rack) + '">' + esc(r.rack) + stockLabel + '</option>';
        }).join('');
    }

    // ============================================================
    //  MODAL HANDLING
    // ============================================================
    function openModal() {
      if (!els.skuSelect.value) {
        showToast('Pilih SKU terlebih dahulu', 'warning');
        return;
      }
      if (STATE.allocations.length >= 6) {
        showToast('Maksimal 6 alokasi rak', 'warning');
        return;
      }

      els.modalSkuName.textContent = els.skuSelect.value;
      els.modalRackSelect.value = '';
      els.modalQtyIn.value = '';
      els.modalTglExp.value = els.tanggalInbound.value;
      updateModalTotal();
      els.allocModal.classList.remove('hidden');
      setTimeout(function () { els.modalQtyIn.focus(); }, 100);
    }

    function closeModal() {
      els.allocModal.classList.add('hidden');
      els.modalRackSelect.value = '';
      els.modalQtyIn.value = '';
    }

    function updateModalTotal() {
      const currentQty = parseInt(els.modalQtyIn.value, 10) || 0;
      els.modalTotalInbound.textContent = fmtNum(STATE.totalQty + currentQty);
    }

    function addAllocation() {
      const rack = els.modalRackSelect.value;
      const qty = parseInt(els.modalQtyIn.value, 10);
      const expiry = els.modalTglExp.value;

      if (!rack) { showToast('Pilih rak terlebih dahulu', 'warning'); return; }
      if (!qty || qty <= 0) { showToast('Masukkan qty yang valid', 'warning'); return; }
      if (!expiry) { showToast('Pilih tanggal kadaluarsa', 'warning'); return; }

      const duplicate = STATE.allocations.findIndex(function (a) { return a.rack === rack; });
      if (duplicate !== -1) { showToast('Rak ' + rack + ' sudah ditambahkan', 'warning'); return; }

      const rackDetail = STATE.rackDetails.find(function (r) { return r.rack === rack; });
      const stockAtRack = rackDetail ? rackDetail.qtySistem : 0;

      STATE.allocations.push({ rack: rack, qty: qty, expiry: expiry, stockAtRack: stockAtRack });
      recalcTotals();
      renderAllocationList();
      closeModal();
      showToast('Alokasi ditambahkan: ' + rack + ' x' + qty, 'success');
    }

    function removeSelectedAllocation() {
      if (STATE.selectedAllocIndex === -1) {
        showToast('Pilih alokasi yang akan dihapus terlebih dahulu', 'warning');
        return;
      }
      const removed = STATE.allocations.splice(STATE.selectedAllocIndex, 1)[0];
      STATE.selectedAllocIndex = -1;
      recalcTotals();
      renderAllocationList();
      showToast('Alokasi dihapus: ' + removed.rack, 'success');
    }

    function recalcTotals() {
      STATE.totalQty = STATE.allocations.reduce(function (sum, a) { return sum + a.qty; }, 0);
      els.totalQtyBadge.textContent = 'Total: ' + fmtNum(STATE.totalQty);
      updateSubmitState();
    }

    function updateSubmitState() {
      const canSubmit = STATE.allocations.length > 0 && els.nomorSJ.value.trim() !== '';
      els.btnSubmit.disabled = !canSubmit;
    }

    // ============================================================
    //  ALLOCATION LIST RENDERING
    // ============================================================
    function renderAllocationList() {
      if (STATE.allocations.length === 0) {
        els.allocationList.innerHTML = '';
        els.allocationList.appendChild(els.emptyState);
        els.emptyState.style.display = 'block';
        els.allocCount.textContent = '0 Rak';
        return;
      }

      els.emptyState.style.display = 'none';
      els.allocCount.textContent = STATE.allocations.length + ' Rak';

      els.allocationList.innerHTML = STATE.allocations.map(function (a, i) {
        const isSelected = i === STATE.selectedAllocIndex;
        const expiryLabel = fmtDateShort(a.expiry);
        const daysLeft = daysUntil(a.expiry);
        let expiryClass = 'text-slate-600';
        if (daysLeft < 0) expiryClass = 'text-rose-600 font-semibold';
        else if (daysLeft <= 30) expiryClass = 'text-amber-600 font-semibold';

        return '<div class="allocation-row px-4 py-3 flex items-center gap-3 ' + (isSelected ? 'selected' : '') + '" data-idx="' + i + '">' +
          '<div class="w-10 h-10 rounded-xl bg-blue-50 border border-blue-200 flex items-center justify-center shrink-0">' +
            '<i class="fa-solid fa-box text-blue-700 text-sm"></i>' +
          '</div>' +
          '<div class="flex-1 min-w-0">' +
            '<p class="font-semibold text-slate-800 truncate">Rak ' + esc(a.rack) + '</p>' +
            '<div class="flex items-center gap-2 text-xs text-slate-500 mt-0.5 flex-wrap">' +
              '<span class="badge bg-blue-50 text-blue-700 border-blue-200">Qty: ' + fmtNum(a.qty) + '</span>' +
              '<span class="badge bg-slate-100 text-slate-600 border-slate-200">Stok: ' + fmtNum(a.stockAtRack) + '</span>' +
              '<span class="' + expiryClass + '"><i class="fa-solid fa-calendar-day mr-0.5"></i>' + expiryLabel + '</span>' +
            '</div>' +
          '</div>' +
          '<button class="p-2 rounded-lg hover:bg-rose-100 text-rose-600 transition" data-remove="' + i + '">' +
            '<i class="fa-solid fa-trash-can text-sm"></i>' +
          '</button>' +
        '</div>';
      }).join('');

      document.querySelectorAll('.allocation-row').forEach(function (row) {
        row.addEventListener('click', function (e) {
          if (e.target.closest('[data-remove]')) return;
          const idx = parseInt(this.dataset.idx, 10);
          STATE.selectedAllocIndex = STATE.selectedAllocIndex === idx ? -1 : idx;
          renderAllocationList();
        });
      });

      document.querySelectorAll('[data-remove]').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const idx = parseInt(this.dataset.remove, 10);
          STATE.allocations.splice(idx, 1);
          STATE.selectedAllocIndex = -1;
          recalcTotals();
          renderAllocationList();
          showToast('Alokasi dihapus', 'success');
        });
      });
    }

    // ============================================================
    //  SUBMIT
    // ============================================================
    function submitInbound() {
      if (STATE.allocations.length === 0) { showToast('Tambahkan minimal 1 alokasi rak', 'warning'); return; }
      if (!els.nomorSJ.value.trim()) { showToast('Nomor SJ wajib diisi', 'warning'); return; }

      const data = {
        barcode: els.palletCode.value.trim() || '',
        namaBarang: els.skuSelect.value,
        totalQty: STATE.totalQty,
        tanggalInbound: els.tanggalInbound.value,
        tanggalKadaluarsa: STATE.allocations[0].expiry,
        nomorSJ: els.nomorSJ.value.trim(),
        remarks: els.remarks.value.trim(),
      };

      STATE.allocations.forEach(function (a, i) {
        if (i < 6) {
          data['rack' + (i + 1)] = a.rack;
          data['qtyRack' + (i + 1)] = a.qty;
        }
      });

      els.btnSubmit.disabled = true;
      els.btnSubmit.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin mr-2"></i> Menyimpan...';

      callServer('submitInboundData', [data])
        .then(function (res) {
          showToast((res && res.message) || 'Data inbound berhasil disimpan', 'success');
          resetForm();
        })
        .catch(function (err) {
          showToast('Gagal menyimpan: ' + (err.message || err), 'error');
          els.btnSubmit.innerHTML = '<i class="fa-solid fa-save mr-2"></i> Simpan Inbound';
          updateSubmitState();
        });
    }

    function resetForm() {
      els.palletCode.value = '';
      els.nomorSJ.value = '';
      els.remarks.value = '';
      STATE.allocations = [];
      STATE.selectedAllocIndex = -1;
      STATE.totalQty = 0;
      recalcTotals();
      renderAllocationList();
      els.btnSubmit.innerHTML = '<i class="fa-solid fa-save mr-2"></i> Simpan Inbound';
      updateSubmitState();
    }

    // ============================================================
    //  UTILITIES
    // ============================================================
    function callServer(fn) {
      const args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          [fn].apply(null, args);
      });
    }

    function fmtNum(n) {
      if (n === null || n === undefined || isNaN(n)) return '0';
      return Number(n).toLocaleString('id-ID');
    }

    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function fmtDateShort(iso) {
      if (!iso) return '-';
      const d = new Date(iso + 'T00:00:00');
      if (isNaN(d.getTime())) return iso;
      const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
      return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
    }

    function daysUntil(iso) {
      if (!iso) return null;
      const d = new Date(iso + 'T00:00:00');
      const today = new Date();
      today.setHours(0,0,0,0);
      return Math.round((d - today) / 86400000);
    }

    function showToast(message, type) {
      const toast = document.getElementById('toast');
      const colors = {
        success: 'bg-emerald-700 text-white border-emerald-600',
        error:   'bg-rose-700 text-white border-rose-600',
        warning: 'bg-amber-600 text-white border-amber-500',
        info:    'bg-slate-900 text-white border-slate-700'
      };
      toast.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 z-[60] transition-all duration-300 ' +
        (colors[type] || colors.info) + ' text-sm px-5 py-3.5 rounded-xl shadow-xl flex items-center gap-2.5 max-w-sm border translate-y-0 opacity-100';
      const icon = type === 'success' ? 'fa-circle-check' : type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-info';
      toast.innerHTML = '<i class="fa-solid ' + icon + '"></i> <span>' + esc(message) + '</span>';
      setTimeout(function () { toast.classList.add('translate-y-24', 'opacity-0'); }, 4000);
    }
  </script>
</body>
</html>
